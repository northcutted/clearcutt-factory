# yaml-language-server: $schema=../../schemas/manifest.schema.json
# Amazon Linux 2023 with dnf packages. dnf resolves at lock time; each RPM is
# signature-checked then, and installed offline by sha256 at build time.
apiVersion: factory.clearcutt.dev/v1alpha1
kind: Image
metadata:
  name: amazonlinux-tools
spec:
  base: amazonlinux:2023
  packages: [git, jq, tar, gzip]
  tools:
    - name: kubectl
      from: url
      version: 1.37.1
      url: https://dl.k8s.io/release/v{{version}}/bin/{{os}}/{{arch}}/kubectl
      checksum: "{{url}}.sha256"
  labels:
    org.opencontainers.image.source: https://github.com/northcutted/clearcutt-factory
    org.opencontainers.image.description: Amazon Linux 2023 with git, jq, and kubectl
  user: "65532"
  entrypoint: [/bin/bash]
  # Triage of the Go advisories of 2026-10-08 for the Go tools this image
  # ships, until their upstream builds move to Go 1.26.9/1.27.2.
  vex: [../vex/go-2026-10.openvex.json]
  test:
    command: [/usr/bin/jq, --version]
