# A stack: how the platform team builds Go services. Apps name it and add
# little more than their source; the stack decides the toolchain, the build
# steps, and the image every app ships on.
apiVersion: factory.clearcutt.dev/v1alpha1
kind: Stack
metadata:
  name: go
  description: Static Go binaries on a distroless base
spec:
  # The toolchain the steps run in (pinned by digest in each app's lock).
  build: golang:1
  # What apps ship on. Point this at an image you build with factory (e.g.
  # run: ../go-runtime/image.yaml) and `clearcutt-factory rebase` moves every app onto
  # each rebuild of it without rebuilding the apps.
  run: cgr.dev/chainguard/static:latest
  platforms: [linux/amd64, linux/arm64]
  crossCompile: true          # Go cross-compiles, so no emulation
  buildEnv:
    CGO_ENABLED: "0"
    MAIN: .                   # apps can override, e.g. ./cmd/server
  caches: [/root/.cache/go-build, /go/pkg/mod]
  steps:
    - run: go mod download
    - run: GOOS=$TARGETOS GOARCH=$TARGETARCH go build -trimpath -ldflags="-s -w -buildid=" -o "/out/$APP_NAME" "$MAIN"
  user: "65532"
  entrypoint: ["/app/{{name}}"]
  labels:
    org.opencontainers.image.source: https://github.com/northcutted/clearcutt-factory
