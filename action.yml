# Installs clearcutt-factory, and cosign, syft, and grype, which it calls.
#
#   - uses: northcutted/clearcutt-factory@v0.1.0
#
# At a release tag, the action downloads that release's binary and verifies
# its Sigstore signature (made by this repository's release workflow at that
# tag) before putting it on PATH. At any other ref, or as a local action
# (uses: ./), it builds the binary from the action's own source.
name: ClearCutt Factory
description: Install clearcutt-factory (signature-verified) and the cosign, syft, and grype it uses
author: northcutted
branding:
  icon: package
  color: green
inputs:
  version:
    description: Release to install, e.g. v0.1.0. Default is the tag this action was used at; "source" (or a non-tag ref) builds from the action's source.
    required: false
    default: ""
  tools:
    description: Also install cosign, syft, and grype ("false" installs only clearcutt-factory and cosign).
    required: false
    default: "true"
outputs:
  version:
    description: The installed version ("source" when built from source).
    value: ${{ steps.version.outputs.version }}
runs:
  using: composite
  steps:
    - name: Choose the version
      id: version
      shell: bash
      env:
        INPUT: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        v=$INPUT
        if [ -z "$v" ] && [[ "$ACTION_REF" =~ ^v[0-9] ]]; then v=$ACTION_REF; fi
        if [ -z "$v" ] || ! [[ "$v" =~ ^v[0-9] ]]; then v=source; fi
        echo "version=$v" >> "$GITHUB_OUTPUT"

    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - id: syft
      if: inputs.tools == 'true'
      uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
    - id: grype
      if: inputs.tools == 'true'
      uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
    - name: Put syft and grype on PATH
      if: inputs.tools == 'true'
      shell: bash
      env:
        SYFT: ${{ steps.syft.outputs.cmd }}
        GRYPE: ${{ steps.grype.outputs.cmd }}
      run: |
        dirname "$SYFT" >> "$GITHUB_PATH"
        dirname "$GRYPE" >> "$GITHUB_PATH"

    - if: steps.version.outputs.version == 'source'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.sum

    - name: Install clearcutt-factory
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        SRC: ${{ github.action_path }}
        REPO: northcutted/clearcutt-factory
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/clearcutt-factory/bin"
        mkdir -p "$bin"
        if [ "$VERSION" = source ]; then
          rev=$(git -C "$SRC" describe --tags --always --dirty 2>/dev/null || echo source)
          (cd "$SRC" && go build -trimpath -ldflags "-s -w -X main.version=$rev" -o "$bin/clearcutt-factory" ./cmd/clearcutt-factory)
        else
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          case "$(uname -m)" in
            x86_64 | amd64) arch=amd64 ;;
            aarch64 | arm64) arch=arm64 ;;
            *) echo "::error::no clearcutt-factory release for $(uname -m)"; exit 1 ;;
          esac
          asset="clearcutt-factory-$os-$arch"
          url="https://github.com/$REPO/releases/download/$VERSION"
          curl -fsSL --retry 3 -o "$bin/clearcutt-factory" "$url/$asset"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/clearcutt-factory/$asset.sigstore.json" "$url/$asset.sigstore.json"
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/clearcutt-factory/$asset.sigstore.json" \
            --certificate-identity "https://github.com/$REPO/.github/workflows/release.yml@refs/tags/$VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$bin/clearcutt-factory"
          chmod +x "$bin/clearcutt-factory"
        fi
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/clearcutt-factory" version
