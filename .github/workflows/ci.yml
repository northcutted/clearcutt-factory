name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: Example lockfiles and Containerfiles are current
        run: |
          go install ./cmd/factory
          for m in examples/*/image.yaml examples/*/app.yaml; do factory render -f "$m" --check; done
