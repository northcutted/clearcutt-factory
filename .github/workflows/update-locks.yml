# Re-resolves every input of every image and app once a week and opens one
# pull request per manifest listing what moved (image digests, package and
# tool versions). Nothing moved, nothing proposed: an update that resolves the
# same content keeps the lock, and its stale pull request closes. CI on the
# pull request builds, smoke-tests, scans, and gates the change; merging it
# publishes the rebuilt image.
#
# Pull requests opened with the default GITHUB_TOKEN are github-actions[bot]'s,
# and GitHub holds the workflow runs they trigger until someone approves them
# (the runs show as action_required). Set a CLEARCUTT_BOT_TOKEN secret (a
# GitHub App token, or a fine-grained token with contents and pull-requests
# write) so CI starts on them by itself, and allow Actions to create pull
# requests in the repository settings.
#
# Other repositories call it (see docs/adopting.md):
#
#   jobs:
#     update:
#       uses: northcutted/clearcutt-factory/.github/workflows/update-locks.yml@v0.1.1
#       permissions: {contents: write, pull-requests: write}
#       secrets: inherit
name: update-locks
on:
  schedule:
    - cron: "23 6 * * 1" # Mondays
  workflow_dispatch:
  workflow_call:
    inputs:
      manifests:
        description: Manifest globs, space-separated (bash globstar)
        type: string
        default: "**/image.yaml **/app.yaml"
      factory-version:
        description: clearcutt-factory release to use
        type: string
        default: v0.1.1
permissions:
  contents: read
# One run at a time per ref (and manifests). Runs wait rather than cancel, so
# none stops halfway through its pull requests; a newer run replaces any
# still waiting, and does the same work.
concurrency:
  group: clearcutt-factory-update-locks-${{ github.ref }}-${{ inputs.manifests }}
  cancel-in-progress: false
env:
  FACTORY_VERSION: ${{ inputs.factory-version || 'source' }}
  MANIFESTS: ${{ inputs.manifests || 'examples/*/image.yaml examples/*/app.yaml' }}
jobs:
  manifests:
    runs-on: ubuntu-latest
    outputs:
      manifests: ${{ steps.find.outputs.manifests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: find
        shell: bash
        run: |
          shopt -s globstar nullglob
          found=()
          for pattern in $MANIFESTS; do for f in $pattern; do found+=("$f"); done; done
          echo "manifests=$(printf '%s\n' "${found[@]}" | sort -u | jq -R -s -c 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  update:
    needs: manifests
    if: needs.manifests.outputs.manifests != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        manifest: ${{ fromJSON(needs.manifests.outputs.manifests) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.CLEARCUTT_BOT_TOKEN || github.token }}
      - if: env.FACTORY_VERSION != 'source'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: northcutted/clearcutt-factory
          ref: ${{ env.FACTORY_VERSION }}
          path: .clearcutt-factory
      - if: env.FACTORY_VERSION != 'source'
        uses: ./.clearcutt-factory
        with:
          version: ${{ env.FACTORY_VERSION }}
          tools: "false"
      - if: env.FACTORY_VERSION == 'source'
        uses: ./
        with:
          tools: "false"
      - run: echo "FACTORY_DIR=$([ "$FACTORY_VERSION" = source ] && echo . || echo .clearcutt-factory)" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0; apt and dnf resolve inside the base, per platform

      - name: Re-resolve every input
        env:
          GITHUB_TOKEN: ${{ github.token }} # GitHub API lookups (release digests, nixpkgs revisions) without the anonymous rate limit
        run: clearcutt-factory lock -f "${{ matrix.manifest }}" --update | tee "$RUNNER_TEMP/lock.out"

      - name: Open, update, or close the pull request
        env:
          GH_TOKEN: ${{ secrets.CLEARCUTT_BOT_TOKEN || github.token }}
          MANIFEST: ${{ matrix.manifest }}
        run: |
          dir=$(dirname "$MANIFEST")
          name=$(echo "$dir" | tr '/' '-')
          {
            echo "Weekly \`clearcutt-factory lock --update\` of \`$MANIFEST\`:"
            echo
            echo '```'
            grep '^  ' "$RUNNER_TEMP/lock.out" || true
            echo '```'
            echo
            echo "CI builds, smoke-tests, scans, and gates this change. Merging publishes the rebuilt image."
          } > "$RUNNER_TEMP/body.md"
          "$FACTORY_DIR/.github/scripts/open-pr.sh" "factory/update/$name" "Update the pinned inputs of $dir" "$RUNNER_TEMP/body.md" "$dir"
