# Wakes the repositories that build on what a platform repository published,
# so its apps catch up in minutes instead of at their next scheduled run.
#
# For each newly published image (kind image) it sends repository_dispatch
# clearcutt.build-image-published when the image is a build image (its
# roles, from images.yml's published output, hold build: a stack's
# spec.build names its manifest) and clearcutt.run-image-published when it
# is a run image (roles hold run) or no stack names it (roles empty or
# absent, as from an older images.yml); an image that is both gets both.
# For each stack (kind stack) it sends clearcutt.stack-published, and for a
# shared org profile (kind profile) clearcutt.profile-published. The client
# payload is {image (repository@digest), repository, digest, tags, roles
# (images only), source (this repository)}. Apps (kind app) have no
# dependents and are skipped. Payloads are advisory: receivers re-resolve
# tags from the registry and verify signatures themselves (init's workflow
# runs fleet.yml on run-image-published and update-locks.yml on the
# others), so a stale or forged dispatch can at most start a run that
# changes nothing.
#
# Dependents are the owner's repositories with the topic clearcutt-app (the
# topic and owner inputs), or the repositories input. With estate-report, a
# run image's dependents are instead the owner's repositories whose images
# the estate's clearcutt-verify report proves, by layer digest, are built on
# it (clearcutt-verify estate dependents, from the report bundle estate push
# published, once its signature verifies against estate-report-signer), so
# a publish wakes only the apps built on it. Build images, stacks, and
# profiles have no layer relation to an app, so they go to the topic search,
# as does a run image the report can't answer for (the bundle can't be
# pulled or verified, or a dependent names no repository of the owner as
# its source). An app the report doesn't list yet (it joined the estate
# after the report's run) is not woken: its daily fleet run catches up. The
# repository that published is left out: its own jobs already follow its
# publishes. Search results can lag a topic change by a few minutes.
#
# With estate, it also sends clearcutt.estate-changed ({source, sha}) to
# that repository (an estate workflow, as clearcutt-factory init --estate
# writes it) when published lists anything, apps included, or changed is
# true (a rebase, which published doesn't list), so its report and portal
# refresh now rather than at its next scheduled run.
#
# Dispatching to other repositories needs an identity that can write to them;
# the workflow's GITHUB_TOKEN reaches only its own repository. In order:
#
#   1. A GitHub App installed on the dependents (the app-id input or a
#      CLEARCUTT_APP_ID variable, and a CLEARCUTT_APP_PRIVATE_KEY secret)
#      with Contents: read and write. One token, with metadata read on the
#      owner's repositories the App is installed on, finds the dependents;
#      another, with contents write on only those repositories (and the
#      estate repository), dispatches.
#   2. A CLEARCUTT_BOT_TOKEN secret with Contents: read and write on them.
#
# Call it as soon as images.yml has published: with reproduce: false there,
# and a second call of images.yml that only reproduces, beside this one, the
# apps don't wait for the second-runner reproduction (a failed one still
# fails the run).
#
#   jobs:
#     images:
#       uses: northcutted/clearcutt-factory/.github/workflows/images.yml@v0.4.1
#       permissions: {contents: read, packages: write, id-token: write, attestations: write}
#       with:
#         reproduce: false
#     reproduce:
#       needs: images
#       if: ${{ !cancelled() && needs.images.outputs.published != '[]' && needs.images.outputs.published != '' }}
#       uses: northcutted/clearcutt-factory/.github/workflows/images.yml@v0.4.1
#       permissions: {contents: read, packages: write, id-token: write, attestations: write}
#       with:
#         published: ${{ needs.images.outputs.published }}
#     notify:
#       needs: images
#       if: ${{ !cancelled() && github.event_name == 'push' && needs.images.outputs.published != '[]' }}
#       uses: northcutted/clearcutt-factory/.github/workflows/notify.yml@v0.4.1
#       permissions: {contents: read}
#       with:
#         published: ${{ needs.images.outputs.published }}
#       secrets:
#         CLEARCUTT_APP_PRIVATE_KEY: ${{ secrets.CLEARCUTT_APP_PRIVATE_KEY }}
#         CLEARCUTT_BOT_TOKEN: ${{ secrets.CLEARCUTT_BOT_TOKEN }}
name: notify
on:
  workflow_call:
    inputs:
      published:
        description: 'What was published: a JSON array of {kind (image, app, stack, or profile), image (repository@digest), repository, digest, tags, roles (an image: build and/or run)}, such as images.yml''s published output'
        type: string
        required: true
      topic:
        description: Dependents are the owner's repositories with this topic
        type: string
        default: clearcutt-app
      owner:
        description: Whose repositories to search (default this repository's owner)
        type: string
        default: ""
      repositories:
        description: Dependents to notify instead of searching by topic (names in the owner, or owner/name), space-separated
        type: string
        default: ""
      app-id:
        description: GitHub App to dispatch as, by Client ID or App ID (default the CLEARCUTT_APP_ID variable); needs the CLEARCUTT_APP_PRIVATE_KEY secret
        type: string
        default: ""
      estate-report:
        description: 'An estate report bundle clearcutt-verify estate push published (REGISTRY/REPOSITORY:TAG, pulled anonymously). A run image''s dependents are then the owner''s repositories whose images the report proves, by layer digest, are built on it, instead of the topic search; build images, stacks, profiles, and a run image the report can''t answer for keep the topic search. Needs estate-report-signer'
        type: string
        default: ""
      estate-report-signer:
        description: 'With estate-report, the certificate identity that must have signed the bundle, exactly: the estate workflow, e.g. https://github.com/OWNER/estate/.github/workflows/estate.yml@refs/heads/main (GitHub Actions issuer)'
        type: string
        default: ""
      estate:
        description: 'Also send clearcutt.estate-changed ({source, sha}) to this repository (a name in the owner, or OWNER/NAME): the estate repository, whose report should refresh now. Sent when published lists anything (apps too), or changed is true'
        type: string
        default: ""
      changed:
        description: 'With estate: something changed that published doesn''t list (an app rebased, say), so send clearcutt.estate-changed even when published is empty'
        type: boolean
        default: false
    secrets:
      CLEARCUTT_APP_PRIVATE_KEY:
        description: Private key of the GitHub App named by app-id or CLEARCUTT_APP_ID
        required: false
      CLEARCUTT_BOT_TOKEN:
        description: Token to dispatch with when there is no GitHub App (Contents read and write on the dependents)
        required: false
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      APP_ID: ${{ inputs.app-id || vars.CLEARCUTT_APP_ID }}
      APP_KEY_SET: ${{ secrets.CLEARCUTT_APP_PRIVATE_KEY != '' }}
      OWNER: ${{ inputs.owner || github.repository_owner }}
    steps:
      - name: What to announce
        id: events
        env:
          PUBLISHED: ${{ inputs.published }}
        run: |
          # One dispatch body per line. An image is announced by its roles:
          # build-image-published when it is a build image, and
          # run-image-published when it is a run image or no stack names it
          # (older images.yml outputs have no roles); both when it is both.
          jq -c --arg source "$GITHUB_REPOSITORY" '
            .[]
            | ((.kind // "image") | ascii_downcase) as $kind
            | select(($kind == "image" or $kind == "stack" or $kind == "profile") and (.digest // "") != "")
            | (.repository // (.image | sub("@.*$"; ""))) as $repository
            | ((.roles // []) | map(ascii_downcase)) as $roles
            | ($roles | any(. == "build")) as $build
            | (if $kind == "stack" then ["clearcutt.stack-published"]
               elif $kind == "profile" then ["clearcutt.profile-published"]
               else (if $build then ["clearcutt.build-image-published"] else [] end)
                    + (if ($roles | any(. == "run")) or ($build | not) then ["clearcutt.run-image-published"] else [] end)
               end) as $events
            | . as $item
            | $events[]
            | {
                event_type: .,
                client_payload: ({image: ($item.image // ($repository + "@" + $item.digest)), repository: $repository, digest: $item.digest, tags: ($item.tags // []), source: $source}
                                 + (if $kind == "image" then {roles: $roles} else {} end))
              }' <<<"${PUBLISHED:-[]}" > "$RUNNER_TEMP/events"
          if [ -s "$RUNNER_TEMP/events" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
            jq -r '"\(.event_type) \(.client_payload.image)"' "$RUNNER_TEMP/events"
          else
            echo "nothing to announce"
          fi

      - name: Estate changed?
        id: estate
        env:
          ESTATE: ${{ inputs.estate }}
          CHANGED: ${{ inputs.changed }}
          PUBLISHED: ${{ inputs.published }}
        run: |
          if [ -n "$ESTATE" ] && { [ "$CHANGED" = true ] || [ "$(jq 'length' <<<"${PUBLISHED:-[]}")" -gt 0 ]; }; then
            echo "send=true" >> "$GITHUB_OUTPUT"
            echo "clearcutt.estate-changed to $ESTATE"
          fi

      # The estate report, for the run images' dependents by layer digest:
      # a signature-verified clearcutt-verify release (the one this action
      # commit is tagged with), and the bundle, read only once its signature
      # verifies against estate-report-signer.
      - name: Install clearcutt-verify
        if: steps.events.outputs.any == 'true' && inputs.estate-report != ''
        uses: northcutted/clearcutt-verify@8e1aec561ece55d8a1a9a6f7c8e11d9143bf45e4 # v0.17.0
      - name: Dependents by layer digest, from the estate report
        id: report
        if: steps.events.outputs.any == 'true' && inputs.estate-report != ''
        env:
          ESTATE_REPORT: ${{ inputs.estate-report }}
          SIGNER: ${{ inputs.estate-report-signer }}
        run: |
          # {"<run image repository>": ["owner/name", …]} for each run image
          # the report answers for; any other is left to the topic search.
          set +e
          if [ -z "$SIGNER" ]; then
            echo "::warning::estate-report needs estate-report-signer, who must have signed the bundle; finding dependents by topic"
            exit 0
          fi
          dir=$RUNNER_TEMP/estate
          if ! clearcutt-verify estate pull "$ESTATE_REPORT" --output "$dir" \
            --certificate-identity "$SIGNER" --certificate-oidc-issuer https://token.actions.githubusercontent.com ||
            [ ! -s "$dir/estate-report.json" ]; then
            echo "::warning::could not pull $ESTATE_REPORT, or its signature didn't verify against $SIGNER; finding dependents by topic"
            exit 0
          fi
          echo '{}' > "$RUNNER_TEMP/report.json"
          jq -r 'select(.event_type == "clearcutt.run-image-published") | .client_payload.repository' "$RUNNER_TEMP/events" | sort -u |
            while IFS= read -r repo; do
              if ! clearcutt-verify --format json estate dependents --report "$dir/estate-report.json" --base "$repo" > "$RUNNER_TEMP/dependents.json"; then
                echo "::warning::the estate report can't tell what is built on $repo; finding its dependents by topic"
                continue
              fi
              # Each dependent's source must be a GitHub repository of the
              # owner; one that isn't leaves this image to the topic search.
              if ! repos=$(jq -e -c --arg owner "$OWNER" '
                  [.dependents[]
                   | ((.source.url // "") | sub("\\.git$"; "") | sub("/+$"; "")) as $url
                   | ([$url | capture("^https://github\\.com/(?<o>[^/]+)/(?<n>[^/]+)$")?] | .[0]) as $m
                   | if $m != null and ($m.o | ascii_downcase) == ($owner | ascii_downcase) then "\($m.o)/\($m.n)" else error("no repository of the owner: \(.imageId)") end]
                  | unique' "$RUNNER_TEMP/dependents.json" 2> "$RUNNER_TEMP/dependents.err"); then
                echo "::warning::$repo: $(sed -E 's/^jq: error \(at [^)]*\): //' "$RUNNER_TEMP/dependents.err"); finding its dependents by topic"
                continue
              fi
              jq --arg repo "$repo" --argjson repos "$repos" '.[$repo] = $repos' "$RUNNER_TEMP/report.json" > "$RUNNER_TEMP/report.next" &&
                mv "$RUNNER_TEMP/report.next" "$RUNNER_TEMP/report.json"
              echo "$repo: built on it, by layer digest: $(jq -r 'join(", ") | if . == "" then "nothing" else . end' <<<"$repos")"
            done
          exit 0

      # Half an App (an ID without a key, or a key without an ID) fails here
      # rather than quietly falling back to another identity.
      - name: Mint a GitHub App token to find dependents
        id: find-token
        if: steps.events.outputs.any == 'true' && inputs.repositories == '' && (env.APP_ID != '' || env.APP_KEY_SET == 'true')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.APP_ID }}
          private-key: ${{ secrets.CLEARCUTT_APP_PRIVATE_KEY }}
          # Every repository of the owner the App is installed on, with
          # metadata read only: enough to find the dependents by topic. The
          # token that dispatches is limited to them (below).
          owner: ${{ env.OWNER }} # zizmor: ignore[github-app]
          permission-metadata: read

      # One line per dispatch: the repository, a tab, the body.
      - name: Find dependents
        id: find
        if: steps.events.outputs.any == 'true' || steps.estate.outputs.send == 'true'
        env:
          GH_TOKEN: ${{ steps.find-token.outputs.token || secrets.CLEARCUTT_BOT_TOKEN || github.token }}
          TOPIC: ${{ inputs.topic }}
          REPOSITORIES: ${{ inputs.repositories }}
          ESTATE: ${{ inputs.estate }}
          ESTATE_SEND: ${{ steps.estate.outputs.send }}
        run: |
          : > "$RUNNER_TEMP/targets"
          # The topic search (or the repositories input), once, when an
          # event needs it.
          by_topic() {
            if [ ! -f "$RUNNER_TEMP/found" ]; then
              if [ -n "$REPOSITORIES" ]; then
                for r in $REPOSITORIES; do
                  case "$r" in */*) echo "$r" ;; *) echo "$OWNER/$r" ;; esac
                done > "$RUNNER_TEMP/found"
              else
                gh search repos --owner "$OWNER" --topic "$TOPIC" --archived=false --limit 1000 --json fullName --jq '.[].fullName' > "$RUNNER_TEMP/found"
              fi
            fi
            cat "$RUNNER_TEMP/found"
          }
          if [ -s "$RUNNER_TEMP/events" ]; then
            while IFS= read -r event; do
              type=$(jq -r .event_type <<<"$event")
              repo=$(jq -r .client_payload.repository <<<"$event")
              if [ "$type" = clearcutt.run-image-published ] && [ -f "$RUNNER_TEMP/report.json" ] &&
                jq -e --arg r "$repo" 'has($r)' "$RUNNER_TEMP/report.json" > /dev/null; then
                jq -r --arg r "$repo" '.[$r][]' "$RUNNER_TEMP/report.json" > "$RUNNER_TEMP/these"
              else
                by_topic > "$RUNNER_TEMP/these"
              fi
              { grep -vixF "$GITHUB_REPOSITORY" "$RUNNER_TEMP/these" || true; } | sort -u |
                while IFS= read -r r; do printf '%s\t%s\n' "$r" "$event"; done >> "$RUNNER_TEMP/targets"
            done < "$RUNNER_TEMP/events"
          fi
          if [ "$ESTATE_SEND" = true ]; then
            case "$ESTATE" in */*) estate=$ESTATE ;; *) estate=$OWNER/$ESTATE ;; esac
            printf '%s\t%s\n' "$estate" "$(jq -n -c --arg source "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" \
              '{event_type: "clearcutt.estate-changed", client_payload: {source: $source, sha: $sha}}')" >> "$RUNNER_TEMP/targets"
          fi
          cut -f1 "$RUNNER_TEMP/targets" | sort -u > "$RUNNER_TEMP/dependents"
          if [ -s "$RUNNER_TEMP/dependents" ]; then
            echo "repositories=$(paste -sd, "$RUNNER_TEMP/dependents")" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/dependents"
          else
            echo "no dependents of $GITHUB_REPOSITORY (repositories of $OWNER with the topic $TOPIC, the repositories input, or the estate report)"
          fi

      - name: Mint a GitHub App token for the dependents
        id: dispatch-token
        if: steps.find.outputs.repositories != '' && (env.APP_ID != '' || env.APP_KEY_SET == 'true')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.APP_ID }}
          private-key: ${{ secrets.CLEARCUTT_APP_PRIVATE_KEY }}
          owner: ${{ env.OWNER }}
          repositories: ${{ steps.find.outputs.repositories }}
          permission-contents: write

      - name: Dispatch
        if: steps.find.outputs.repositories != ''
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token || secrets.CLEARCUTT_BOT_TOKEN || github.token }}
        run: |
          failed=0
          while IFS=$'\t' read -r repo event; do
            what=$(jq -r '"\(.event_type) \(.client_payload.image // .client_payload.source)"' <<<"$event")
            if gh api --method POST "repos/$repo/dispatches" --input - <<<"$event" >/dev/null; then
              echo "$repo: $what"
            else
              echo "::error::could not send $what to $repo: the GitHub App must be installed there, or CLEARCUTT_BOT_TOKEN needs Contents read and write on it"
              failed=1
            fi
          done < "$RUNNER_TEMP/targets"
          exit "$failed"
