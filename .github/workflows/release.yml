# Publishes a release when a v* tag is pushed: tested, reproducible binaries
# for Linux and macOS on amd64 and arm64, each signed keylessly by this
# workflow (a Sigstore bundle next to it) and covered by SLSA provenance,
# plus SHA256SUMS. The action (action.yml) verifies the signature against
# this workflow's identity at the tag before installing a binary.
#
# Cut a release with scripts/release.sh vX.Y.Z.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # keyless signing and provenance
      attestations: write # provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: go vet ./... && go test ./...

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -buildvcs=false \
              -ldflags "-s -w -buildid= -X main.version=$VERSION" \
              -o "dist/clearcutt-factory-$os-$arch" ./cmd/clearcutt-factory
          done

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/clearcutt-factory-*-*

      - name: Sign
        run: |
          for f in dist/clearcutt-factory-*; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          (cd dist && sha256sum clearcutt-factory-* > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          # The CHANGELOG section for this version is the release notes.
          awk -v v="## $VERSION" '$0 ~ "^## " { p = (index($0, v) == 1) } p' CHANGELOG.md | tail -n +2 > notes.md
          gh release create "$VERSION" dist/* --title "$VERSION" --notes-file notes.md --verify-tag
