# Keeps every app on the newest build of its stack's run image without
# rebuilding it: daily, and after the images workflow publishes a push to
# main.
#
# Each app's published image is rebased (when safe), smoke-tested, scanned,
# gated, pushed, signed, and checked by repeating the rebase from its signed
# record. A pull request then pins the app's lock to the same base, so the
# next build from source doesn't move it back. An app that can't be rebased
# gets the same pull request (building it is the fix) and its job fails.
#
# The pull requests are opened as a GitHub App, CLEARCUTT_BOT_TOKEN, or the
# workflow's GITHUB_TOKEN, as update-locks.yml describes. Other repositories
# call it from their own schedule (see docs/adopting.md), passing secrets by
# name (secrets: inherit reaches only workflows in the caller's organization
# or enterprise):
#
#   jobs:
#     fleet:
#       uses: northcutted/clearcutt-factory/.github/workflows/fleet.yml@v0.1.1
#       permissions: {contents: write, pull-requests: write, packages: write, id-token: write}
#       secrets:
#         CLEARCUTT_APP_PRIVATE_KEY: ${{ secrets.CLEARCUTT_APP_PRIVATE_KEY }}
#         CLEARCUTT_BOT_TOKEN: ${{ secrets.CLEARCUTT_BOT_TOKEN }}
name: fleet
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [images]
    types: [completed]
    branches: [main]
  workflow_call:
    inputs:
      apps:
        description: App manifest globs, space-separated (bash globstar)
        type: string
        default: "**/app.yaml"
      registry:
        description: Registry to log in to before pushing
        type: string
        default: ghcr.io
      factory-version:
        description: clearcutt-factory release to use
        type: string
        default: v0.1.1
      app-id:
        description: GitHub App to open pull requests as, by Client ID or App ID (default the CLEARCUTT_APP_ID variable); needs the CLEARCUTT_APP_PRIVATE_KEY secret
        type: string
        default: ""
    secrets:
      CLEARCUTT_APP_PRIVATE_KEY:
        description: Private key of the GitHub App named by app-id or CLEARCUTT_APP_ID
        required: false
      CLEARCUTT_BOT_TOKEN:
        description: Token to open pull requests with when there is no GitHub App (contents and pull-requests write)
        required: false
      REGISTRY_USERNAME:
        description: Registry user, for a registry other than ghcr.io
        required: false
      REGISTRY_PASSWORD:
        description: Registry password or token, for a registry other than ghcr.io
        required: false
permissions:
  contents: read
# One run at a time per ref (and apps). Runs wait rather than cancel: a
# cancelled run could leave an app pushed and its lock not pinned. A newer run
# replaces any still waiting, and does the same work.
concurrency:
  group: clearcutt-factory-fleet-${{ github.ref }}-${{ inputs.apps }}
  cancel-in-progress: false
env:
  FACTORY_VERSION: ${{ inputs.factory-version || 'source' }}
  APPS: ${{ inputs.apps || 'examples/*/app.yaml' }}
  REGISTRY: ${{ inputs.registry || 'ghcr.io' }}
jobs:
  apps:
    # After the images workflow, only a successful push: it also runs for
    # pull requests, whose head branch can be called main too (from a fork).
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.find.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: find
        shell: bash
        run: |
          shopt -s globstar nullglob
          found=()
          for pattern in $APPS; do for f in $pattern; do found+=("$f"); done; done
          echo "apps=$(printf '%s\n' "${found[@]}" | sort -u | jq -R -s -c 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  rebase:
    needs: apps
    if: needs.apps.outputs.apps != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write # push to ghcr.io
      id-token: write # keyless signing
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.apps) }}
    defaults:
      run:
        shell: bash
    env:
      APP_ID: ${{ inputs.app-id || vars.CLEARCUTT_APP_ID }}
      APP_KEY_SET: ${{ secrets.CLEARCUTT_APP_PRIVATE_KEY != '' }}
    steps:
      # See update-locks.yml: limited to this repository's contents and pull
      # requests, and half an App fails rather than falls back.
      - name: Mint a GitHub App token
        id: app
        if: env.APP_ID != '' || env.APP_KEY_SET == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.APP_ID }}
          private-key: ${{ secrets.CLEARCUTT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token || secrets.CLEARCUTT_BOT_TOKEN || github.token }}
      - if: env.FACTORY_VERSION != 'source'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: northcutted/clearcutt-factory
          ref: ${{ env.FACTORY_VERSION }}
          path: .clearcutt-factory
      - if: env.FACTORY_VERSION != 'source'
        uses: ./.clearcutt-factory
        with:
          version: ${{ env.FACTORY_VERSION }}
      - if: env.FACTORY_VERSION == 'source'
        uses: ./
      - run: echo "FACTORY_DIR=$([ "$FACTORY_VERSION" = source ] && echo . || echo .clearcutt-factory)" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0; smoke tests run every platform
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Rebase onto the newest run image
        id: rebase
        env:
          GITHUB_TOKEN: ${{ github.token }} # GitHub API lookups when the lock is re-resolved
        run: |
          if clearcutt-factory rebase -f "${{ matrix.app }}" --push --update-lock 2>&1 | tee "$RUNNER_TEMP/rebase.out"; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
          result=$(find out -path '*-rebase/result.json' 2>/dev/null | head -n 1 || true)
          if [ -n "$result" ] && [ "$(jq -r .published "$result")" = true ]; then
            echo "image=$(jq -r '.image // empty' "$result")" >> "$GITHUB_OUTPUT"
          fi

      - name: Repeat the rebase from its signed record
        if: steps.rebase.outputs.image != ''
        env:
          APP: ${{ matrix.app }}
        run: |
          dir=$(dirname "$APP")
          while [ ! -f "$dir/factory.org.yaml" ] && [ "$dir" != . ] && [ "$dir" != / ]; do dir=$(dirname "$dir"); done
          org=()
          if [ -f "$dir/factory.org.yaml" ]; then org=(--org "$dir/factory.org.yaml"); fi
          clearcutt-factory verify --image "${{ steps.rebase.outputs.image }}" "${org[@]}"

      - name: Pin the lock to the same base
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.CLEARCUTT_BOT_TOKEN || github.token }}
          APP: ${{ matrix.app }}
          FAILED: ${{ steps.rebase.outputs.failed }}
        run: |
          dir=$(dirname "$APP")
          name=$(echo "$dir" | tr '/' '-')
          # A rebase that failed before pinning the lock (a registry error,
          # say) decided nothing: keep any pull request open. Only a rebase
          # that finished with the lock unchanged closes it.
          if [ "$FAILED" = true ] && git diff --quiet -- "$dir" && [ -z "$(git ls-files --others --exclude-standard -- "$dir")" ]; then
            echo "the lock was not pinned; leaving any pull request as it is"
            exit 0
          fi
          if [ "$FAILED" = true ]; then
            intro="The published image could not be rebased. This moves the lock to the newest run image, so merging rebuilds the app on it from source."
          else
            intro="The published image is on the newest run image. This pins the lock to the same base, so the next build from source doesn't move it back."
          fi
          { echo "$intro"; echo; echo '```'; cat "$RUNNER_TEMP/rebase.out"; echo '```'; } > "$RUNNER_TEMP/body.md"
          "$FACTORY_DIR/.github/scripts/open-pr.sh" "factory/rebase/$name" "Pin $dir to the newest run image" "$RUNNER_TEMP/body.md" "$dir"

      - name: Fail if the app must be rebuilt
        if: steps.rebase.outputs.failed == 'true'
        run: |
          echo "::error::${{ matrix.app }} could not be rebased; see the rebase step (and the pull request, if the lock moved)"
          exit 1
