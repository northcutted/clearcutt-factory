# Builds every image and app under examples/. Pull requests build, scan, and gate;
# main also pushes, signs (keyless, via this workflow's OIDC identity), attaches
# SBOM / vulnerability / recipe attestations, adds SLSA provenance, and then
# independently rebuilds from the signed recipe to prove reproducibility.
name: images
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: platform-tools, manifest: examples/platform-tools/image.yaml}
          - {image: debian-tools, manifest: examples/debian-tools/image.yaml}
          - {image: amazonlinux-tools, manifest: examples/amazonlinux-tools/image.yaml}
          - {image: hello-app, manifest: examples/hello-app/app.yaml}
    permissions:
      contents: read
      packages: write       # push to ghcr.io
      id-token: write       # keyless signing and provenance
      attestations: write   # provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      - name: Put syft and grype on PATH
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          dirname "$SYFT" >> "$GITHUB_PATH"
          dirname "$GRYPE" >> "$GITHUB_PATH"
      - run: go install ./cmd/clearcutt-factory

      - name: Lock and Containerfile are current
        run: clearcutt-factory render -f ${{ matrix.manifest }} --check

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, scan, gate (and push, sign, attest on main)
        id: build
        run: clearcutt-factory build -f ${{ matrix.manifest }} ${{ github.event_name != 'pull_request' && '--push' || '' }}

      - name: SLSA build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ matrix.image }}
          path: |
            out/${{ matrix.image }}/result.json
            out/${{ matrix.image }}/attestations/

  # A second, independent machine rebuilds from the signed recipe alone.
  reproduce:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # new ghcr.io packages start private
    strategy:
      fail-fast: false
      matrix:
        image: [platform-tools, debian-tools, amazonlinux-tools, hello-app]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: go install ./cmd/clearcutt-factory
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.image }}
          path: build-result
      - name: Rebuild from the recipe attestation and compare digests
        working-directory: examples
        run: clearcutt-factory verify --image "$(jq -r .image ../build-result/result.json)"
