# Builds every image and app under examples/. Pull requests build, scan, and gate;
# main also pushes, signs (keyless, via this workflow's OIDC identity), attaches
# SBOM / vulnerability / recipe attestations, adds SLSA provenance, and then
# independently rebuilds from the signed recipe to prove reproducibility.
name: images
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: platform-tools, manifest: examples/platform-tools/image.yaml}
          - {image: debian-tools, manifest: examples/debian-tools/image.yaml}
          - {image: amazonlinux-tools, manifest: examples/amazonlinux-tools/image.yaml}
          - {image: hello-app, manifest: examples/hello-app/app.yaml}
    permissions:
      contents: read
      packages: write       # push to ghcr.io
      id-token: write       # keyless signing and provenance
      attestations: write   # provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v4
      - uses: sigstore/cosign-installer@v4
      - uses: anchore/sbom-action/download-syft@v0
      - uses: anchore/scan-action/download-grype@v7
      - run: go install ./cmd/factory

      - name: Lock and Containerfile are current
        run: factory render -f ${{ matrix.manifest }} --check

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, scan, gate (and push, sign, attest on main)
        id: build
        run: factory build -f ${{ matrix.manifest }} ${{ github.event_name != 'pull_request' && '--push' || '' }}

      - name: SLSA build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.build.outputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.image }}
          path: |
            out/${{ matrix.image }}/result.json
            out/${{ matrix.image }}/attestations/

  # A second, independent machine rebuilds from the signed recipe alone.
  reproduce:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # new ghcr.io packages start private
    strategy:
      fail-fast: false
      matrix:
        image: [platform-tools, debian-tools, amazonlinux-tools, hello-app]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v4
      - uses: sigstore/cosign-installer@v4
      - run: go install ./cmd/factory
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.image }}
          path: build-result
      - name: Rebuild from the recipe attestation and compare digests
        working-directory: examples
        run: factory verify --image "$(jq -r .image ../build-result/result.json)"
