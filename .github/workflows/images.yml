# Builds every image and app manifest. Pull requests build, smoke-test, scan,
# and gate; runs on the default branch (and on the publish-ref input's ref)
# also push, sign keylessly (this workflow's OIDC identity), attach SBOM /
# vulnerability / recipe attestations, add SLSA provenance, and rebuild each
# newly published image on a second runner from its signed recipe alone,
# attesting the match. Runs on any other ref (workflow_dispatch from a
# branch) only build and check. Unchanged images aren't republished.
#
# Other repositories call it (see docs/adopting.md):
#
#   jobs:
#     images:
#       uses: northcutted/clearcutt-factory/.github/workflows/images.yml@v0.4.1
#       permissions: {contents: read, packages: write, id-token: write, attestations: write}
#
# Secrets (optional): REGISTRY_USERNAME and REGISTRY_PASSWORD for a registry
# other than ghcr.io. Pass them by name (secrets: {REGISTRY_USERNAME: …});
# secrets: inherit reaches only workflows in the caller's organization or
# enterprise.
#
# With changed-only: true, a pull request builds only the manifests its
# changes affect (clearcutt-factory affected; a changed file no manifest
# owns builds them all); other events build every manifest. Branch
# protection should then require the result job (<caller job> / result),
# which passes when everything the run built passed, rather than the
# per-manifest builds, which differ from one pull request to the next.
#
# Output: published, what the run newly published (see the published job).
# notify.yml takes it to wake the repositories that build on those images;
# each image carries its roles (build, run, both, or none: what the stacks
# in this repository make of it), so notify.yml can announce a build image
# as clearcutt.build-image-published and a run image as
# clearcutt.run-image-published.
#
# A job that calls this workflow ends, and its outputs arrive, only when
# every job here has, the second-runner reproduction included. To start
# jobs that need only published (notify.yml, fleet.yml) as soon as the
# images are published, call it twice: once with reproduce: false, and once
# more with that call's published output, which only reproduces it. The
# reproduction is then signed by this workflow as before, and a failed one
# still fails the run:
#
#   jobs:
#     images:
#       uses: northcutted/clearcutt-factory/.github/workflows/images.yml@v0.4.1
#       permissions: {contents: read, packages: write, id-token: write, attestations: write}
#       with:
#         reproduce: false
#     reproduce:
#       needs: images
#       if: ${{ !cancelled() && needs.images.outputs.published != '[]' && needs.images.outputs.published != '' }}
#       uses: northcutted/clearcutt-factory/.github/workflows/images.yml@v0.4.1
#       permissions: {contents: read, packages: write, id-token: write, attestations: write}
#       with:
#         published: ${{ needs.images.outputs.published }}
#     notify:
#       needs: images # not reproduce
#       …
name: images
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      manifests:
        description: Manifest globs, space-separated (bash globstar)
        type: string
        default: "**/image.yaml **/app.yaml"
      registry:
        description: Registry to log in to before pushing
        type: string
        default: ghcr.io
      provenance:
        description: Add SLSA build provenance (GitHub artifact attestations)
        type: boolean
        default: true
      reproduce:
        description: Rebuild each newly published image on a second runner and attest the match; false to do that in a second call (see published), so jobs that need only the published output don't wait for it
        type: boolean
        default: true
      published:
        description: 'Build nothing; reproduce what an earlier call in this run published (its published output) on a second runner and attest the match'
        type: string
        default: ""
      publish-ref:
        description: 'A ref (or bash glob, e.g. refs/heads/release/*) that publishes too, besides the default branch. Runs on any other ref (workflow_dispatch from a branch, say) build and check without publishing'
        type: string
        default: ""
      changed-only:
        description: 'On a pull request, build only the manifests its changes affect (clearcutt-factory affected): their own directories, what they extend and name, an app''s stack and its images, the org profiles above them; a changed file no manifest owns (a shared profile, a workflow) builds every manifest, and nothing affected builds nothing. Other events build every manifest. Require the result job in branch protection, not the per-manifest builds'
        type: boolean
        default: false
      factory-version:
        description: clearcutt-factory release to use
        type: string
        default: v0.4.1
      aws-role-arn:
        description: 'Log in to Amazon ECR (the registry input: ACCOUNT.dkr.ecr.REGION.amazonaws.com) by assuming this IAM role with GitHub OIDC, instead of with REGISTRY_USERNAME and REGISTRY_PASSWORD (registry-login/action.yml, in the factory-version release)'
        type: string
        default: ""
      aws-region:
        description: With aws-role-arn, the region (default the registry's)
        type: string
        default: ""
      gcp-workload-identity-provider:
        description: 'Log in to Google Artifact Registry (the registry input: REGION-docker.pkg.dev) as gcp-service-account, through this workload identity provider (projects/NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER) with GitHub OIDC'
        type: string
        default: ""
      gcp-service-account:
        description: With gcp-workload-identity-provider, the service account to impersonate
        type: string
        default: ""
      azure-client-id:
        description: 'Log in to Azure Container Registry (the registry input: NAME.azurecr.io) as this app registration or managed identity, federated with GitHub OIDC; with azure-tenant-id and azure-subscription-id'
        type: string
        default: ""
      azure-tenant-id:
        description: With azure-client-id, its tenant ID
        type: string
        default: ""
      azure-subscription-id:
        description: With azure-client-id, the subscription ID
        type: string
        default: ""
    secrets:
      REGISTRY_USERNAME:
        description: Registry user, for a registry other than ghcr.io
        required: false
      REGISTRY_PASSWORD:
        description: Registry password or token, for a registry other than ghcr.io
        required: false
    outputs:
      published:
        description: 'What the run newly published, a JSON array of {manifest, kind (image or app), image (repository@digest), repository, digest, tags, roles (an image: build and/or run, as the stacks here name its manifest; [] when none does)}; [] on pull requests and when nothing changed'
        value: ${{ jobs.published.outputs.published || '[]' }}
permissions:
  contents: read
# One run at a time per ref (and manifests), so two pushes can't race on the
# tags. Publishing runs wait rather than cancel; a newer one replaces any run
# still waiting, which is fine because each run builds every manifest at its
# own commit. A pull request's newer run cancels the older one. The prefix
# keeps the group apart from a caller's own. A call that only reproduces
# moves no tags, so it has a group of its own and no other run replaces it.
concurrency:
  group: ${{ inputs.published && format('clearcutt-factory-reproduce-{0}-{1}', github.run_id, github.run_attempt) || format('clearcutt-factory-images-{0}-{1}', github.ref, inputs.manifests) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Callers use a release; this repository's own events build from source.
  FACTORY_VERSION: ${{ inputs.factory-version || 'source' }}
  # changed-only applies to pull requests; every other event builds all.
  CHANGED_ONLY: ${{ inputs.changed-only && github.event_name == 'pull_request' && !inputs.published }}
  MANIFESTS: ${{ inputs.manifests || 'examples/*/image.yaml examples/*/app.yaml' }}
  REGISTRY: ${{ inputs.registry || 'ghcr.io' }}
  # Log in by OIDC federation (registry-login/action.yml) instead of with a
  # username and password, when any of its inputs is set.
  OIDC_LOGIN: ${{ format('{0}{1}{2}{3}{4}{5}{6}', inputs.aws-role-arn, inputs.aws-region, inputs.gcp-workload-identity-provider, inputs.gcp-service-account, inputs.azure-client-id, inputs.azure-tenant-id, inputs.azure-subscription-id) != '' }}
jobs:
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      manifests: ${{ steps.find.outputs.manifests }}
      publish: ${{ steps.ref.outputs.publish }}
    steps:
      # Only the default branch publishes (pushes, signs, opens pull
      # requests), or the ref the publish-ref input names: a pull request,
      # or workflow_dispatch from another branch, builds and checks only.
      # schedule, repository_dispatch, and workflow_run run on the default
      # branch.
      - name: Publish from this ref?
        id: ref
        shell: bash
        env:
          PUBLISH_REF: ${{ inputs.publish-ref }}
        run: |
          default=$(jq -r '.repository.default_branch // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
          # publish-ref may be a glob (refs/heads/release/*).
          # shellcheck disable=SC2053
          publish_ref() { [ -n "$PUBLISH_REF" ] && [[ "$GITHUB_REF" == $PUBLISH_REF ]]; }
          publish=false
          case "$GITHUB_EVENT_NAME" in
            pull_request | pull_request_target | merge_group) ;;
            *)
              if [ -n "$default" ] && [ "$GITHUB_REF" = "refs/heads/$default" ]; then
                publish=true
              elif [ -z "$default" ] && [[ "$GITHUB_EVENT_NAME" =~ ^(schedule|repository_dispatch|workflow_run)$ ]]; then
                publish=true
              elif publish_ref; then
                publish=true
              fi
              ;;
          esac
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$publish" = false ] && [[ "$GITHUB_EVENT_NAME" != pull_request* ]]; then
            echo "::notice::$GITHUB_REF is not the default branch${default:+ ($default)}${PUBLISH_REF:+ or $PUBLISH_REF}: checking only, nothing is published"
          fi
      # changed-only on a pull request: the merge commit GitHub made and its
      # two parents, the first being the base branch, so the diff between
      # them is what the pull request changes; and clearcutt-factory, which
      # tells which manifests that affects.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHANGED_ONLY == 'true' && 2 || 1 }}
      - if: env.CHANGED_ONLY == 'true' && env.FACTORY_VERSION != 'source'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: northcutted/clearcutt-factory
          ref: ${{ env.FACTORY_VERSION }}
          path: .clearcutt-factory
      - if: env.CHANGED_ONLY == 'true' && env.FACTORY_VERSION != 'source'
        uses: ./.clearcutt-factory
        with:
          version: ${{ env.FACTORY_VERSION }}
          tools: "false"
      - if: env.CHANGED_ONLY == 'true' && env.FACTORY_VERSION == 'source'
        uses: ./
        with:
          tools: "false"
      # Every manifest the manifests input matches; with changed-only on a
      # pull request, only those its changes affect (none, when it changes
      # nothing a manifest owns but deletes files). When that can't be told
      # (no merge commit, or a factory-version without affected), every
      # manifest, with a warning.
      - name: Find the manifests
        id: find
        shell: bash
        env:
          PUBLISHED: ${{ inputs.published }}
        run: |
          if [ -n "$PUBLISHED" ]; then
            # Only reproducing: the manifests the earlier call published.
            echo "manifests=$(jq -c '[.[] | .manifest // empty] | unique' <<<"$PUBLISHED")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          shopt -s globstar nullglob
          found=()
          for pattern in $MANIFESTS; do for f in $pattern; do found+=("$f"); done; done
          all=$(printf '%s\n' "${found[@]}" | sort -u | jq -R -s -c 'split("\n") | map(select(. != ""))')
          manifests=$all
          if [ "$CHANGED_ONLY" = true ] && [ "$all" != '[]' ]; then
            if ! git rev-parse -q --verify 'HEAD^2' > /dev/null; then
              echo "::warning::changed-only: $(git rev-parse --short HEAD) is not the pull request's merge commit; building every manifest"
            elif ! git diff --no-renames --name-status -z 'HEAD^1' HEAD > "$RUNNER_TEMP/changed"; then
              echo "::warning::changed-only: could not list what the pull request changes; building every manifest"
            else
              mapfile -t list < <(jq -r '.[]' <<<"$all")
              : > "$RUNNER_TEMP/affected"
              if GITHUB_OUTPUT="$RUNNER_TEMP/affected" clearcutt-factory affected --changed "$RUNNER_TEMP/changed" "${list[@]}" > /dev/null &&
                affected=$(sed -n 's/^manifests=//p' "$RUNNER_TEMP/affected") && [ -n "$affected" ]; then
                manifests=$affected
                echo "::notice::changed-only: the pull request affects $(jq length <<<"$manifests") of $(jq length <<<"$all") manifests: $(jq -r 'join(", ")' <<<"$manifests")"
              else
                echo "::warning::changed-only: could not tell which manifests the pull request affects (clearcutt-factory affected, from v0.4.0); building every manifest"
              fi
            fi
          fi
          echo "manifests=$manifests" >> "$GITHUB_OUTPUT"

  build:
    needs: manifests
    if: needs.manifests.outputs.manifests != '[]' && !inputs.published
    runs-on: ubuntu-latest
    # Other platforms build and smoke-test under emulation.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        manifest: ${{ fromJSON(needs.manifests.outputs.manifests) }}
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless signing and provenance
      attestations: write # provenance
    defaults:
      run:
        shell: bash
    env:
      PUSH: ${{ needs.manifests.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.FACTORY_VERSION != 'source'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: northcutted/clearcutt-factory
          ref: ${{ env.FACTORY_VERSION }}
          path: .clearcutt-factory
      - if: env.FACTORY_VERSION != 'source'
        uses: ./.clearcutt-factory
        with:
          version: ${{ env.FACTORY_VERSION }}
      - if: env.FACTORY_VERSION == 'source'
        uses: ./
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0; other platforms build and smoke-test under emulation
        with:
          # The privileged binfmt image, pinned (update: crane digest tonistiigi/binfmt:<tag>).
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Lock and Containerfile are current
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: clearcutt-factory render -f "$MANIFEST" --check

      - name: Log in to ${{ env.REGISTRY }}
        if: env.PUSH == 'true' && env.OIDC_LOGIN != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - name: Log in to ${{ env.REGISTRY }} by OIDC federation
        if: env.PUSH == 'true' && env.OIDC_LOGIN == 'true'
        uses: ./.clearcutt-factory/registry-login
        with:
          registry: ${{ env.REGISTRY }}
          aws-role-arn: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}
          gcp-workload-identity-provider: ${{ inputs.gcp-workload-identity-provider }}
          gcp-service-account: ${{ inputs.gcp-service-account }}
          azure-client-id: ${{ inputs.azure-client-id }}
          azure-tenant-id: ${{ inputs.azure-tenant-id }}
          azure-subscription-id: ${{ inputs.azure-subscription-id }}

      - name: Build, test, scan, gate (and push, sign, attest on a publishing ref)
        id: build
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: |
          args=(-f "$MANIFEST")
          if [ "$PUSH" = true ]; then args+=(--push); fi
          clearcutt-factory build "${args[@]}"

      # Provenance for every published digest that lacks it: a fresh push, or
      # an image an earlier run pushed without it (the step failed, or was
      # off). Unchanged images that have it get no new attestation. An app
      # build rebased onto a newer base (its tags were on that base) pushed
      # two images, and its tags point at the rebased one, so that one is
      # checked too. format() because inputs is empty outside workflow_call,
      # and null compares equal to false.
      #
      # The attestation is signed by this workflow, which in a calling
      # repository is the called workflow, not the caller's own: gh accepts
      # that only with --signer-workflow, and --repo still requires the run to
      # be in the repository being built. Any ref of the workflow counts;
      # requiring the one in use would attest every unchanged image again
      # after each upgrade.
      - name: Check for SLSA build provenance
        id: provenance
        if: env.PUSH == 'true' && steps.build.outputs.digest != '' && format('{0}', inputs.provenance) != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ steps.build.outputs.published }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REF: ${{ steps.build.outputs.repository }}@${{ steps.build.outputs.digest }}
          SIGNER: northcutted/clearcutt-factory/.github/workflows/images.yml
        run: |
          if [ "$PUBLISHED" = true ] || ! gh attestation verify "oci://$REF" --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" >/dev/null 2>&1; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "$REF already has SLSA build provenance"
          fi
          rebased=$(find out -mindepth 2 -maxdepth 2 -name result.json -exec jq -r --arg digest "$DIGEST" 'select(.digest == $digest) | .rebased // empty' {} + || true)
          if [ -n "$rebased" ]; then
            if ! gh attestation verify "oci://$rebased" --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" >/dev/null 2>&1; then
              echo "rebased-repository=${rebased%@*}" >> "$GITHUB_OUTPUT"
              echo "rebased-digest=${rebased#*@}" >> "$GITHUB_OUTPUT"
            else
              echo "$rebased already has SLSA build provenance"
            fi
          fi

      - name: SLSA build provenance
        if: steps.provenance.outputs.needed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: SLSA build provenance of the rebased image
        if: steps.provenance.outputs.rebased-digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.provenance.outputs.rebased-repository }}
          subject-digest: ${{ steps.provenance.outputs.rebased-digest }}
          push-to-registry: true

      - id: slug
        if: always()
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: echo "slug=$(echo "$MANIFEST" | tr '/.' '--')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ steps.slug.outputs.slug }}
          path: |
            out/*/result.json
            out/*/attestations/
          if-no-files-found: ignore

      # A newly published image, for the published job: also when a later
      # step failed, since the image is out there either way.
      - name: Record what was published
        id: record
        if: ${{ !cancelled() && steps.build.outputs.published == 'true' }}
        env:
          MANIFEST: ${{ matrix.manifest }}
          IMAGE: ${{ steps.build.outputs.image }}
          REPOSITORY: ${{ steps.build.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          kind=$(sed -n "s/^kind:[[:space:]]*[\"']\{0,1\}\([A-Za-z]*\).*/\1/p" "$MANIFEST" | head -n 1 | tr '[:upper:]' '[:lower:]')
          # The build's own result (a build rebased onto a newer base leaves
          # the rebase's result next to it). When it was rebased, its tags
          # point at the rebased image, so that is what was published.
          result=""
          while IFS= read -r f; do
            if jq -e --arg digest "$DIGEST" '.digest == $digest' "$f" >/dev/null; then
              result=$f
              break
            fi
          done < <(find out -mindepth 2 -maxdepth 2 -name result.json)
          if [ -z "$result" ]; then
            echo "::error::no result.json for $DIGEST"
            exit 1
          fi
          # What the stacks in this repository make of an image: build (a
          # stack's spec.build names its manifest), run (spec.run), both, or
          # nothing. notify.yml announces a build image as
          # clearcutt.build-image-published, so apps rebuild on it in
          # minutes. A stack that doesn't load costs the roles, not the
          # publish: the image is announced as a run image, as before.
          roles='[]'
          if [ "${kind:-image}" = image ]; then
            if ! roles=$(clearcutt-factory roles -f "$MANIFEST" 2> "$RUNNER_TEMP/roles.err" | jq -R -s -c 'split("\n") | map(select(. != ""))'); then
              echo "::warning::could not tell what the stacks make of $MANIFEST; announcing it as a run image: $(tr '\n' ' ' < "$RUNNER_TEMP/roles.err")"
              roles='[]'
            fi
          fi
          mkdir -p "$RUNNER_TEMP/published"
          jq -c --arg manifest "$MANIFEST" --arg kind "${kind:-image}" --arg image "$IMAGE" --arg repository "$REPOSITORY" --arg digest "$DIGEST" --argjson roles "$roles" \
            '(.rebased // "") as $rebased
             | {manifest: $manifest, kind: $kind,
                image: (if $rebased != "" then $rebased else $image end),
                repository: $repository,
                digest: (if $rebased != "" then ($rebased | split("@")[1]) else $digest end),
                tags: (.tags // []),
                roles: $roles}' "$result" \
            | tee "$RUNNER_TEMP/published/published.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.record.outcome == 'success' }}
        with:
          name: clearcutt-published-${{ steps.slug.outputs.slug }}
          path: ${{ runner.temp }}/published/published.json

  # The one check to require on pull requests: it passes when every manifest
  # the run built passed, and when there was nothing to build (changed-only
  # on a pull request that affects no manifest). The per-manifest build
  # checks differ from one pull request to the next under changed-only, so
  # branch protection that names them would wait forever for one that
  # doesn't run.
  result:
    needs: [manifests, build]
    if: ${{ always() && !inputs.published }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every manifest that needed building built
        shell: bash
        env:
          MANIFESTS: ${{ needs.manifests.result }}
          BUILD: ${{ needs.build.result }}
          BUILT: ${{ needs.manifests.outputs.manifests }}
        run: |
          echo "manifests: $MANIFESTS; build: $BUILD; built: ${BUILT:-none}"
          if [ "$MANIFESTS" != success ] || { [ "$BUILD" != success ] && ! { [ "$BUILD" = skipped ] && [ "$BUILT" = '[]' ]; }; }; then
            echo "::error::not every manifest built (manifests: $MANIFESTS, build: $BUILD)"
            exit 1
          fi

  # The workflow's published output: every image and app this run newly
  # published, as a JSON array of {manifest, kind, image, repository, digest,
  # tags, roles}. Images that were already published (only their tags moved)
  # are not in it.
  published:
    needs: [manifests, build]
    if: ${{ !cancelled() && needs.manifests.outputs.publish == 'true' && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      published: ${{ steps.list.outputs.published }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: clearcutt-published-*
          path: published
      - id: list
        shell: bash
        run: |
          mkdir -p published # no artifact when nothing was published
          find published -name published.json -exec cat {} + | jq -s -c 'sort_by(.manifest)' > "$RUNNER_TEMP/published.json"
          echo "published=$(cat "$RUNNER_TEMP/published.json")" >> "$GITHUB_OUTPUT"
          jq . "$RUNNER_TEMP/published.json"

  # A second, independent machine rebuilds each newly published image from its
  # signed recipe alone: also when another manifest failed to build (that
  # build's failure still fails the run). When the digest matches, it signs
  # a reproduction attestation (…/reproduction/v1) onto the image, so
  # verifiers can see it was independently reproduced, where, and when.
  # With reproduce: false a second call does it, given published. format()
  # because inputs is empty outside workflow_call.
  reproduce:
    needs: [manifests, build]
    if: ${{ !cancelled() && needs.manifests.outputs.publish == 'true' && format('{0}', inputs.reproduce) != 'false' && needs.manifests.result == 'success' && needs.manifests.outputs.manifests != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        manifest: ${{ fromJSON(needs.manifests.outputs.manifests) }}
    permissions:
      contents: read
      packages: write # read private packages; attach the reproduction attestation
      id-token: write # sign it keylessly
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.FACTORY_VERSION != 'source'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: northcutted/clearcutt-factory
          ref: ${{ env.FACTORY_VERSION }}
          path: .clearcutt-factory
      - if: env.FACTORY_VERSION != 'source'
        uses: ./.clearcutt-factory
        with:
          version: ${{ env.FACTORY_VERSION }}
          tools: "false"
      - if: env.FACTORY_VERSION == 'source'
        uses: ./
        with:
          tools: "false"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # The privileged binfmt image, pinned (update: crane digest tonistiigi/binfmt:<tag>).
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - if: env.OIDC_LOGIN != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - name: Log in to ${{ env.REGISTRY }} by OIDC federation
        if: env.OIDC_LOGIN == 'true'
        uses: ./.clearcutt-factory/registry-login
        with:
          registry: ${{ env.REGISTRY }}
          aws-role-arn: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}
          gcp-workload-identity-provider: ${{ inputs.gcp-workload-identity-provider }}
          gcp-service-account: ${{ inputs.gcp-service-account }}
          azure-client-id: ${{ inputs.azure-client-id }}
          azure-tenant-id: ${{ inputs.azure-tenant-id }}
          azure-subscription-id: ${{ inputs.azure-subscription-id }}
      - id: slug
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: echo "slug=$(echo "$MANIFEST" | tr '/.' '--')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ${{ steps.slug.outputs.slug }}
          path: build-result
      # An app build whose tag held an image on a newer base was also rebased
      # onto it (a second result.json); that rebase is repeated from its
      # signed record. A call given published reads the build results of the
      # call that built (the same run), else what published names.
      - name: Rebuild from the recipe attestation, compare digests, and attest a match
        env:
          MANIFEST: ${{ matrix.manifest }}
          PUBLISHED: ${{ inputs.published }}
        run: |
          images=()
          while IFS= read -r result; do
            if [ "$(jq -r .published "$result")" = true ]; then images+=("$(jq -r .image "$result")"); fi
          done < <(find build-result -name result.json 2>/dev/null | sort)
          if [ "${#images[@]}" = 0 ] && [ -n "$PUBLISHED" ]; then
            while IFS= read -r image; do images+=("$image"); done < <(jq -r --arg manifest "$MANIFEST" '.[] | select(.manifest == $manifest) | .image // empty' <<<"$PUBLISHED")
          fi
          if [ "${#images[@]}" = 0 ]; then
            echo "not newly published in this run; nothing to reproduce"
            exit 0
          fi
          # verify --image reads the signer identity from the manifest's org profile.
          dir=$(dirname "$MANIFEST")
          while [ ! -f "$dir/factory.org.yaml" ] && [ "$dir" != . ] && [ "$dir" != / ]; do dir=$(dirname "$dir"); done
          org=()
          if [ -f "$dir/factory.org.yaml" ]; then org=(--org "$dir/factory.org.yaml"); fi
          for image in "${images[@]}"; do clearcutt-factory verify --image "$image" --attest "${org[@]}"; done
